name: Build Orbit Notes Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, v0.16-map-redesign, v1-development]

permissions:
  contents: read

# Avoid concurrent Gradle dependency downloads on successive commits.
# Only the newest candidate commit needs an APK and emulator run.
concurrency:
  group: orbit-notes-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install JavaScript dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev babel-preset-expo@~54.0.0 --no-audit --no-fund

      - name: Run project checks
        run: |
          npm run test:logic
          npm run test:behavior
          npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile standalone APK (release mode)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Notes-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  android-ui-smoke:
    name: Android emulator smoke test (advisory)
    needs: [build-android-apk]
    if: ${{ github.ref_name == 'main' || github.ref_name == 'v0.16-map-redesign' || github.ref_name == 'v1-development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out smoke test
        uses: actions/checkout@v4

      - name: Download compiled APK
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Notes-Android-APK
          path: android/app/build/outputs/apk/release

      - name: Android UI smoke test
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-ui-smoke.sh

      - name: Report emulator failure
        if: ${{ steps.smoke.outcome == 'failure' }}
        run: |
          echo '::warning::Android emulator smoke test failed. APK build and code checks passed, but device startup is not verified.'
          echo '### Emulator smoke test failed (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK build succeeded. Verify startup and library-first behavior on Pixel 10 before acceptance.' >> "$GITHUB_STEP_SUMMARY"

  diagnose-failure:
    name: Diagnose failed Android build
    needs: [build-android-apk]
    if: ${{ always() && needs.build-android-apk.result == 'failure' && github.ref_name == 'v0.16-map-redesign' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Record failed steps
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: runId, per_page: 100
            });
            const failed = jobs.filter(job => job.conclusion === 'failure');
            const lines = [
              '# Orbit Notes build failure diagnostics',
              '',
              'Build: https://github.com/' + owner + '/' + repo + '/actions/runs/' + runId,
              'Commit: ' + context.sha,
              'Branch: ' + context.ref,
              '',
            ];
            for (const job of failed) {
              lines.push('## ' + job.name);
              lines.push('Job logs: ' + job.html_url);
              const steps = (job.steps || []).filter(step => step.conclusion === 'failure');
              if (steps.length === 0) lines.push('- No failed step reported; inspect job logs.');
              for (const step of steps) lines.push('- Failed step: ' + step.name);
              lines.push('');
            }
            if (failed.length === 0) lines.push('No failed job reported; inspect workflow logs.');
            lines.push('Repair is handled by the separate hourly ChatGPT automation.');
            lines.push('Any repair commit requires three review passes.');
            const report = lines.join('\\n') + '\\n';
            fs.writeFileSync('orbit-build-failure.md', report);
            await core.summary.addRaw(report).write();
            core.warning('Orbit Notes build failed; diagnostics saved.');
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Notes-Failure-Diagnostics
          path: orbit-build-failure.md
          if-no-files-found: error
          retention-days: 14


  publish-v1-stable:
    name: Publish stable v1.0.0 release
    # Android device acceptance was completed on Pixel 10. Do not gate publication on
    # host emulator startup (a flaky infrastructure dependency).
    needs: [build-android-apk]
    if: ${{ github.ref_name == 'main' && needs.build-android-apk.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out validated release
        uses: actions/checkout@v4
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Notes-Android-APK
          path: release-apk
      - name: Verify stable version and APK
        run: |
          node -e 'const a=require("./app.json").expo,p=require("./package.json");if(a.version!=="1.0.0"||a.android.versionCode!==19||p.version!=="1.0.0")throw Error("Version mismatch")'
          test "$(find release-apk -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          unzip -t -q release-apk/*.apk
      - name: Create Git tag and GitHub stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha')"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag v1.0.0 already exists at another commit: $existing" >&2
              exit 1
            fi
            gh release upload v1.0.0 release-apk/*.apk --clobber
          else
            gh release create v1.0.0 release-apk/*.apk --target "$GITHUB_SHA" --title 'Orbit Notes v1.0.0 — Stable' --notes-file RELEASE_NOTES_v1.0.0.md --latest
          fi
