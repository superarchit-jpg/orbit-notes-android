name: Build Orbit Notes Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, v0.16-map-redesign]

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install JavaScript dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev babel-preset-expo@~54.0.0 --no-audit --no-fund

      - name: Run project checks
        run: |
          npm run test:logic
          npm run test:behavior
          npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile standalone APK (release mode)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Notes-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # TEST-01: Run an Android emulator smoke test against the built release APK.
      # This checks actual startup and the library-first screen, not only TypeScript.
      - name: Android UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
            test -n "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.orbitnotes.prototype || true
            adb shell monkey -p com.orbitnotes.prototype 1
            FOUND=0
            for attempt in $(seq 1 25); do
              sleep 3
              adb shell uiautomator dump /sdcard/orbit-ui.xml >/dev/null 2>&1 || true
              adb pull /sdcard/orbit-ui.xml /tmp/orbit-ui.xml >/dev/null 2>&1 || true
              if grep -q 'Create map' /tmp/orbit-ui.xml 2>/dev/null; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" != 1 ]; then
              echo 'TEST-01 FAIL: Library-first Create map action not visible'
              adb logcat -d -t 300 | tail -n 150
              exit 1
            fi
            echo 'TEST-01 PASS: release APK launches into library with Create map action'
